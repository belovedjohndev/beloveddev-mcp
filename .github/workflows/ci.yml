name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PORT: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 18 recovery clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "DATABASE_RECOVERY_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Start PostgreSQL on an assigned localhost port
        run: |
          cp .env.example .env
          docker compose config --quiet
          npm run db:up
          endpoint=$(docker compose port postgres 5432)
          echo "DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
          echo "DATABASE_MIGRATION_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run verify:all
      - name: Verify migration generation has no drift
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- packages/database/migrations)"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose --env-file .env.example down --volumes

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and smoke-test the local stdio release image
        run: npm run test:container
