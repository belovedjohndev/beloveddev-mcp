name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PORT: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL on an assigned localhost port
        run: |
          cp .env.example .env
          docker compose config --quiet
          npm run db:up
          endpoint=$(docker compose port postgres 5432)
          echo "DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run verify:all
      - name: Verify migration generation has no drift
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- packages/database/migrations)"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose --env-file .env.example down --volumes
