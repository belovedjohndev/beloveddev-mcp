name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_PORT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install PostgreSQL 18 recovery clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "DATABASE_RECOVERY_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Start PostgreSQL on an assigned localhost port
        run: |
          cp .env.example .env
          docker compose config --quiet
          npm run db:up
          endpoint=$(docker compose port postgres 5432)
          echo "DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
          echo "DATABASE_MIGRATION_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://beloveddev:beloveddev_local_only@$endpoint/beloveddev" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run verify:all
      - name: Verify migration generation has no drift
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- packages/database/migrations)"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose --env-file .env.example down --volumes

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and smoke-test the local stdio release image
        run: npm run test:container
      - name: Prove scanner failure and vulnerable-package enforcement
        run: npm run security:verify
      - name: Scan the exact packaged release with current vulnerability data
        run: npm run security:image
      - name: Retain scanner JSON evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-security-evidence-${{ github.run_attempt }}
          path: .security-reports/run-*/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  production-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run security:dependencies
      - name: Audit the complete development and production dependency tree
        run: npm audit --audit-level=high --strict-ssl=true
      - name: Retain production audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-audit-evidence-${{ github.run_attempt }}
          path: .security-reports/run-*/production-dependencies.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
